name: little_learners
description: A Flutter-based e-learning platform for toddlers with offline-first learning modules.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  provider: ^6.1.2
  sqflite: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.2
  audioplayers: 6.5.1
  video_player: ^2.9.2
  file_picker: ^11.0.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.5
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/audio/learning/
    - assets/audio/koala/
    # Cut from assets/audio/_masters/ by tool/prepare_audio.py. The masters
    # are deliberately not listed here: they stay in the repo for re-cutting
    # and add nothing to the app.
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/images/koala/
    - assets/images/splash/
    - assets/seed/
    - assets/videos/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-VariableFont_wdth_wght.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-VariableFont_wght.ttf
