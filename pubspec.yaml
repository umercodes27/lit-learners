name: little_learners
description: A Flutter-based e-learning platform for toddlers with offline-first learning modules.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  provider: ^6.1.2
  # Only the admin AI authoring client uses this. Already resolved
  # transitively at this exact version by the Firebase plugins, so
  # naming it here changes nothing about resolution.
  http: ^1.6.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.2
  audioplayers: 6.5.1
  video_player: ^2.9.2
  file_picker: ^11.0.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.5
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  flutter_animate: ^4.5.2
  # Speaks letters and numerals for the age-3 tracing levels, so the full
  # A-Z and Alif-to-Yay range needs no recorded clip per glyph.
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    # Age 2 content pack ("Little Learner AGE 2"). Kept under its own folder so
    # a future age pack drops in beside it with its own JSON and nothing else
    # has to change.
    - assets/age2/
    - assets/age2/audio/en/
    - assets/age2/audio/num/
    - assets/age2/audio/sfx/
    - assets/age2/audio/stories/
    - assets/age2/audio/ur/
    - assets/age2/img/
    - assets/age2/img/story/
    - assets/age2/img/ur/
    # Age 3 content pack ("Little Learner AGE 3"), served by whichever age the
    # active child's profile says, not by a picker.
    - assets/age3/
    - assets/age3/audio/en/
    - assets/age3/audio/num/
    - assets/age3/audio/sfx/
    - assets/age3/audio/stories/
    - assets/age3/audio/ur/
    - assets/age3/img/
    - assets/age3/img/story/
    - assets/age3/img/ur/
    # Age 4 content pack ("Little Learner AGE 4"). Same shape as the packs
    # above; the img/ files it shares with the younger packs are copied in
    # rather than reached across, so one pack is never a dependency of
    # another.
    - assets/age4/
    - assets/age4/audio/num/
    - assets/age4/audio/sfx/
    - assets/age4/audio/stories/
    - assets/age4/img/
    - assets/age4/img/story/
    - assets/age4/img/ur/
    - assets/audio/learning/
    - assets/audio/koala/
    # Cut from assets/audio/_masters/ by tool/prepare_audio.py. The masters
    # are deliberately not listed here: they stay in the repo for re-cutting
    # and add nothing to the app.
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/images/koala/
    - assets/images/splash/
    - assets/seed/
    # Video lessons, one folder per age. Flutter's asset directories are not
    # recursive, so naming the parent bundled nothing: the films sit one level
    # down and every lesson failed to open. Each folder has to be named.
    - assets/videos/age2/
    - assets/videos/age3/
    - assets/videos/age4/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-VariableFont_wdth_wght.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-VariableFont_wght.ttf
